[package]
name = "tn-hibe"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "BBG HIBE cipher core for tn-proto: a stable re-export of the tn-bbg scheme (identity paths, canonical encodings, the CEK KEM, and the hybrid seal blob)."

[dependencies]
tn-bbg = { path = "../tn-bbg" }
bls12_381_plus = "0.8.9"

[dev-dependencies]
rand_core = { workspace = true }
rand_chacha = "0.3"
serde_json = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
getrandom = { version = "0.2", features = ["js"] }
