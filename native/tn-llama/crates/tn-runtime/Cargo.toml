[package]
name = "tn-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
tn-core = { path = "../../upstream/tn-proto/crypto/tn-core", default-features = false, features = ["fs", "fs-locking"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
base64 = "0.22"
subtle = "2.6"
thiserror = "1"
hex = "0.4"
zeroize = "1.8"
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "3"
tn-test-tools = { path = "../tn-test-tools" }
